<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Fondo circular azul -->
  <circle cx="105" cy="100" r="80" fill="#48A9C5" />
  
  <g stroke="#001E32" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Línea de suelo y rocas -->
    <line x1="30" y1="150" x2="180" y2="150" />
    <polygon points="35,150 42,140 50,138 58,143 65,150" fill="#ECEBE4" />
    <polygon points="75,150 78,144 84,150" fill="#ECEBE4" />
    <!-- Escombros volando -->
    <circle cx="45" cy="130" r="1.5" fill="#ECEBE4" stroke="none" />
    <circle cx="55" cy="125" r="2" fill="#ECEBE4" stroke="none" />
    <circle cx="75" cy="135" r="1.5" fill="#ECEBE4" stroke="none" />

    <!-- Mástil vertical (Torre de perforación) -->
    <rect x="65" y="15" width="6" height="130" fill="#ECEBE4" />
    <rect x="58" y="45" width="4" height="90" fill="#B4B4AA" />
    <!-- Cabezal de rotación y soportes -->
    <rect x="55" y="55" width="18" height="8" fill="#ECEBE4" />
    <rect x="55" y="85" width="16" height="25" fill="#B4B4AA" />
    <rect x="54" y="120" width="19" height="8" fill="#ECEBE4" />
    <circle cx="71" cy="30" r="5" fill="#B4B4AA" />
    <!-- Broca en el suelo -->
    <polygon points="65,135 71,135 71,146 65,150" fill="#B4B4AA" />

    <!-- Manguera de aire/barrido -->
    <path d="M 55 95 C 40 115, 50 135, 65 142" fill="none" stroke="#001E32" stroke-width="5.5" />
    <path d="M 55 95 C 40 115, 50 135, 65 142" fill="none" stroke="#77746E" stroke-width="2" />

    <!-- Brazo de soporte del mástil -->
    <polygon points="71,78 108,112 104,118 71,88" fill="#ECEBE4" />
    <line x1="71" y1="100" x2="95" y2="105" stroke-width="4" />

    <!-- Chasis y cuerpo del motor -->
    <polygon points="102,92 128,92 132,125 102,125" fill="#ECEBE4" />
    <!-- Ventana de cabina -->
    <polygon points="105,96 124,96 124,114 105,118" fill="#77746E" />
    
    <!-- Compartimento trasero (Compresor/Motor) -->
    <polygon points="128,96 184,96 186,125 128,125" fill="#ECEBE4" />
    <polygon points="130,120 186,120 186,132 165,136 130,128" fill="#77746E" />
    <line x1="155" y1="96" x2="155" y2="120" />
    <line x1="175" y1="96" x2="175" y2="120" />
    <!-- Escape -->
    <path d="M 168 96 L 168 88 L 172 86" fill="none" stroke-width="4" />

    <!-- Orugas (Tracks) -->
    <rect x="92" y="130" width="66" height="18" rx="9" fill="#77746E" />
    <rect x="96" y="134" width="58" height="10" rx="5" fill="#425563" />
    <circle cx="101" cy="139" r="4" fill="#B4B4AA" />
    <circle cx="149" cy="139" r="4" fill="#B4B4AA" />
  </g>
</svg>
