<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Fondo circular amarillo -->
  <circle cx="100" cy="105" r="80" fill="#FFC72C" />
  
  <g stroke="#001E32" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Línea de suelo -->
    <line x1="25" y1="162" x2="175" y2="162" />

    <!-- Rocas en el cucharón -->
    <polygon points="155,70 165,62 175,65 182,60 192,70 185,82 155,78" fill="#B4B4AA" />
    <polyline points="165,72 172,66 180,72" fill="none" />

    <!-- Cucharón (Bucket) elevado -->
    <polygon points="150,65 156,58 164,72 198,68 182,88 168,94 152,82" fill="#ECEBE4" />
    <polygon points="152,82 168,94 182,88 172,98 158,95" fill="#B4B4AA" />

    <!-- Brazo de carga (Boom) -->
    <polygon points="118,118 132,96 158,92 168,94 156,105 142,106 126,126" fill="#ECEBE4" />
    <!-- Cilindro hidráulico -->
    <line x1="122" y1="108" x2="145" y2="95" stroke="#77746E" stroke-width="6" />
    <line x1="122" y1="108" x2="145" y2="95" stroke="#001E32" stroke-width="2" />

    <!-- Chasis trasero (Motor bajo perfil) -->
    <polygon points="18,122 85,118 85,146 22,146 16,138" fill="#ECEBE4" />
    <polygon points="28,128 60,126 56,138 28,138" fill="#77746E" />
    <!-- Parrilla trasera -->
    <line x1="36" y1="128" x2="36" y2="138" />
    <line x1="44" y1="128" x2="44" y2="138" />
    <!-- Parachoques -->
    <rect x="15" y="136" width="22" height="6" fill="#B4B4AA" />

    <!-- Cabina central -->
    <rect x="85" y="106" width="24" height="40" fill="#ECEBE4" />
    <!-- Techo cabina -->
    <line x1="82" y1="106" x2="112" y2="106" stroke-width="5" />
    <!-- Ventanas cabina -->
    <rect x="89" y="111" width="7" height="14" fill="#77746E" />
    <rect x="99" y="111" width="7" height="14" fill="#77746E" />
    <rect x="88" y="132" width="18" height="12" fill="#77746E" />

    <!-- Chasis delantero -->
    <polygon points="109,116 125,116 142,135 142,146 109,146" fill="#ECEBE4" />
    <!-- Escalera de acceso -->
    <line x1="109" y1="124" x2="116" y2="124" />
    <line x1="109" y1="132" x2="116" y2="132" />
    <line x1="109" y1="140" x2="116" y2="140" />

    <!-- Rueda Trasera -->
    <circle cx="70" cy="144" r="18" fill="#425563" />
    <circle cx="70" cy="144" r="10" fill="#B4B4AA" />
    <circle cx="70" cy="144" r="4" fill="#425563" />

    <!-- Rueda Delantera -->
    <circle cx="138" cy="144" r="18" fill="#425563" />
    <circle cx="138" cy="144" r="10" fill="#B4B4AA" />
    <circle cx="138" cy="144" r="4" fill="#425563" />
  </g>
</svg>
