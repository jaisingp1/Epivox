<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Fondo circular verde -->
  <circle cx="100" cy="100" r="80" fill="#4C8C2B" />
  
  <!-- Engranaje de fondo (Marca de agua) -->
  <g stroke="#86C8BC" stroke-width="2.5" fill="none">
    <circle cx="100" cy="100" r="52" />
    <circle cx="100" cy="100" r="60" stroke-dasharray="14 10" stroke-width="8" />
  </g>

  <!-- Pieza principal rotada a -45 grados -->
  <g transform="translate(100, 100) rotate(-45) translate(-100, -100)" stroke="#001E32" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- Rosca superior (Culata / Shank) -->
    <rect x="82" y="25" width="36" height="35" rx="6" fill="#ECEBE4" />
    <line x1="82" y1="33" x2="118" y2="33" />
    <line x1="82" y1="40" x2="118" y2="40" />
    <line x1="82" y1="47" x2="118" y2="47" />
    <line x1="82" y1="54" x2="118" y2="54" />

    <!-- Cuerpo intermedio biselado -->
    <polygon points="75,60 125,60 125,78 75,78" fill="#ECEBE4" />
    <rect x="95" y="60" width="30" height="18" fill="#B4B4AA" />

    <!-- Cuerpo principal de la broca (Faldón) -->
    <polygon points="64,78 136,78 140,125 60,125" fill="#ECEBE4" />
    <!-- Sombreado lateral para volumen 3D -->
    <polygon points="105,78 136,78 140,125 105,125" fill="#B4B4AA" />
    <line x1="64" y1="95" x2="136" y2="95" />

    <!-- Engranaje / Piñón satélite superpuesto -->
    <g transform="translate(112, 85)">
      <polygon points="-12,-15 12,-15 16,10 -16,10" fill="#77746E" />
      <line x1="-8" y1="-15" x2="-10" y2="10" />
      <line x1="-2" y1="-15" x2="-3" y2="10" />
      <line x1="4" y1="-15" x2="4" y2="10" />
      <line x1="10" y1="-15" x2="11" y2="10" />
      <ellipse cx="0" cy="10" rx="16" ry="7" fill="#ECEBE4" />
      <ellipse cx="0" cy="10" rx="7" ry="3" fill="#425563" />
    </g>

    <!-- Base de la corona (Frente de perforación con botones/dientes) -->
    <ellipse cx="100" cy="128" rx="40" ry="22" fill="#77746E" />
    <ellipse cx="100" cy="128" rx="32" ry="16" fill="#ECEBE4" />
    
    <!-- Corona dentada exterior -->
    <path d="M 60,125 L 64,136 L 70,130 L 76,142 L 84,135 L 90,148 L 98,138 L 104,148 L 112,136 L 120,145 L 126,132 L 134,138 L 140,125" fill="#B4B4AA" />

    <!-- Cono / Piloto central de carburo -->
    <polygon points="82,128 118,128 110,152 90,152" fill="#77746E" />
    <line x1="90" y1="128" x2="94" y2="152" />
    <line x1="100" y1="128" x2="100" y2="152" />
    <line x1="110" y1="128" x2="106" y2="152" />
    
    <!-- Punta de perforación -->
    <polygon points="88,152 112,152 100,172" fill="#ECEBE4" />
    <polygon points="100,152 112,152 100,172" fill="#B4B4AA" />
  </g>
</svg>
